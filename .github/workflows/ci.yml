name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  self-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system libraries (Linux headless OpenCV/MediaPipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check harmoni.py

      - name: Self-test (donanimsiz cekirdek testleri)
        run: python harmoni.py --self-test

      - name: Upload preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harmoni-preview-${{ matrix.os }}-py${{ matrix.python-version }}
          path: harmoni_preview.png
          if-no-files-found: ignore
